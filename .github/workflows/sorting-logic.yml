name: Sorting logic tests
on:
  push:
    paths:
      - 'scripts/disposal.py'
      - 'scripts/replay_sorting.py'
      - 'scripts/guard_candidate.py'
      - 'scripts/evaluate_sorting.py'
      - 'scripts/specialists.py'
      - 'scripts/storage.py'
      - 'configs/disposal.json'
      - 'configs/specialists.json'
      - 'tests/test_disposal.py'
      - 'tests/test_replay_sorting.py'
      - 'tests/test_guard_candidate.py'
      - 'tests/test_sorting_evaluation.py'
      - '.github/workflows/sorting-logic.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sorting policy, replay, accuracy, and promotion guard tests
        run: |
          python3 -m unittest discover -s tests -p 'test_disposal.py' -v
          python3 -m unittest discover -s tests -p 'test_replay_sorting.py' -v
          python3 -m unittest discover -s tests -p 'test_guard_candidate.py' -v
          python3 -m unittest discover -s tests -p 'test_sorting_evaluation.py' -v
