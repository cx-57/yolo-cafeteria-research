name: One-time branch archive and cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'cx-57/yolo-cafeteria-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Archive every non-main ref before deleting any branch
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          if ! grep -Fxq main branches.txt; then
            echo "Refusing cleanup: main missing from branch list" >&2
            exit 1
          fi
          grep -Fxv main branches.txt > prune.txt || true
          echo "Branches queued for backup: $(wc -l < prune.txt)"
          : > planned.tsv
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            sha="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
            printf '%s\t%s\n' "$sha" "$branch" >> planned.tsv
          done < prune.txt

          # Stage and verify *all* backup tags; abort before deletion on any mismatch.
          while IFS=$'\t' read -r sha branch; do
            [[ -n "$branch" ]] || continue
            ref="refs/tags/pre-branch-prune-20261119/$branch"
            short="${ref#refs/}"
            existing="$(gh api "repos/$GH_REPO/git/ref/$short" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$existing" ]]; then
              gh api -X POST "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$sha" >/dev/null
            elif [[ "$existing" != "$sha" ]]; then
              echo "Backup tag conflict: $branch" >&2
              exit 1
            fi
            actual="$(gh api "repos/$GH_REPO/git/ref/$short" --jq '.object.sha')"
            [[ "$actual" == "$sha" ]] || { echo "Backup verification failed: $branch" >&2; exit 1; }
          done < planned.tsv
          echo "All branch-history backup tags verified."

          # Do not delete an updated branch; leave it and fail safely.
          while IFS=$'\t' read -r sha branch; do
            [[ -n "$branch" ]] || continue
            current="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$current" == "$sha" ]] || { echo "Branch changed during cleanup: $branch" >&2; exit 1; }
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted branch reference: $branch"
          done < planned.tsv

          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > remaining.txt
          if [[ "$(cat remaining.txt)" != "main" ]]; then
            echo "Unexpected remaining branch references:" >&2
            cat remaining.txt >&2
            exit 1
          fi
          echo "Cleanup complete: only main remains; deleted branch commits are preserved by verified backup tags."
