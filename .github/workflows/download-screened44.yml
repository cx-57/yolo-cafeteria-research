name: Download reviewed 44 images from GitHub

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/download-screened44.yml"
      - "scripts/package_screened44.py"
  push:
    paths:
      - ".github/workflows/download-screened44.yml"
      - "scripts/package_screened44.py"

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small packaging dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Download original 48-photo source artifact
        uses: actions/download-artifact@v4
        with:
          name: public-waste-provisional-not-independent
          run-id: 41315363803
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/trashbox-source
      - name: Download original 38-photo source artifact
        uses: actions/download-artifact@v4
        with:
          name: commons-licensed-photo-candidates-not-independent
          run-id: 41317184879
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/commons-source
      - name: Verify identities and assemble exactly 44 image files
        shell: bash
        run: |
          python scripts/package_screened44.py \
            --trashbox "$RUNNER_TEMP/trashbox-source" \
            --commons "$RUNNER_TEMP/commons-source" \
            --out "$RUNNER_TEMP/cafeteria-44-package"
          python - <<'PY'
          import pathlib,sys,zipfile
          sys.path.insert(0,'scripts')
          import explore_candidates as e
          from tempfile import TemporaryDirectory
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'cafeteria-44-package'
          with TemporaryDirectory() as tmp:
              bundle=pathlib.Path(tmp)/'test.zip'
              with zipfile.ZipFile(bundle,'w') as z:
                  for f in sorted(root.rglob('*')):
                      if f.is_file():
                          z.write(f,f.relative_to(root).as_posix())
              m=e.unpack_checked(bundle,pathlib.Path(tmp)/'unpacked')
              assert len(m['images'])==44
              print('PASS: 44 exact byte-hash-verified originals; compatible with explore.')
          PY
      - name: Upload directly usable model-input ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cafeteria-44-image-review-kit-github
          path: ${{ runner.temp }}/cafeteria-44-package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
