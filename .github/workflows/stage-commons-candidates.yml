name: Stage Wikimedia source candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/stage-commons-candidates.yml"
  push:
    paths:
      - ".github/workflows/stage-commons-candidates.yml"
      - "scripts/stage_commons_candidates.py"

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Download licensed source candidates (NOT test data)
        shell: bash
        run: |
          python scripts/stage_commons_candidates.py \
            --per-group 16 \
            --out "$RUNNER_TEMP/commons-review-candidates"
      - uses: actions/upload-artifact@v4
        with:
          name: commons-licensed-photo-candidates-not-independent
          path: ${{ runner.temp }}/commons-review-candidates
          retention-days: 7
          if-no-files-found: error
