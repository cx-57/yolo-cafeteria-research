name: Collect licensed leftover-photo candidates (not training-ready)

on:
  push:
    branches:
      - experiment/cafeteria-domain-image-intake-20261102
    paths:
      - scripts/acquire_leftover_candidates.py
      - .github/workflows/collect-leftover-candidates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dataset reader and image dependencies
        run: |
          python -m pip install --disable-pip-version-check 'datasets>=3.0,<5.0' 'pillow>=10.0'
      - name: Acquire licensed image candidates (no YOLO labels)
        run: |
          python scripts/acquire_leftover_candidates.py --output "$RUNNER_TEMP/cafeteria-leftover-candidates" --limit 215
      - name: Upload candidate image pack
        uses: actions/upload-artifact@v4
        with:
          name: ccby-leftover-plate-215-image-candidates-not-labeled
          path: ${{ runner.temp }}/cafeteria-leftover-candidates/
          retention-days: 30
          if-no-files-found: error
          compression-level: 4
      - name: Save auditable run receipt on experiment branch
        env:
          RUN_NUMBER: ${{ github.run_id }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p results
          python - <<'PY'
          import json,os,pathlib
          from datetime import datetime,timezone
          report=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"cafeteria-leftover-candidates"/"summary.json").read_text())
          report["workflow_run_id"]=int(os.environ["RUN_NUMBER"])
          report["branch"]=os.environ["GIT_BRANCH"]
          report["collected_utc"]=datetime.now(timezone.utc).isoformat()
          pathlib.Path("results/leftover-candidate-intake-receipt.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/leftover-candidate-intake-receipt.json
          git commit -m "Record licensed leftover-image acquisition run"
          git push
