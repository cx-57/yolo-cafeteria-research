name: YOLO real-image integration smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-yolo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ultralytics and project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run two tiny YOLO fits, evaluations, and checkpoint predictions
        env:
          YOLO_CONFIG_DIR: /tmp/yolo-integration-config
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: python tests/yolo_smoke.py
      - name: Save small integration logs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo-integration-artifacts
          path: |
            model/runs/ci-smoke-*/results.csv
            model/runs/evaluation_val*/metrics.json
          if-no-files-found: ignore
