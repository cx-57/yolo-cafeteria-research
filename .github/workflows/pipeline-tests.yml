name: Pipeline tests

on:
  push:
    branches: [main, training-phase-10x-20261011]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install Pillow PyYAML
      - name: Run offline synthetic pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Build full 10x corpus without training
        run: python src/train.py --build-only --augment-factor 10
      - name: Preserve split and class counts
        uses: actions/upload-artifact@v4
        with:
          name: split-summary
          path: data/training/split_summary.json
