name: Probe official FLIC Google Drive public downloads
on:
  push:
    branches:
      - experiment/flic-bulk-originals-masks-20261102
    paths:
      - .github/workflows/probe-flic-public-download.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct official Drive file access
        shell: bash
        run: |
          python -m pip install --quiet gdown
          python - <<'PY'
          import requests
          file_id = "1UzTuuNc0klgk7HVmI6NjYpQ_0rc73fzL"
          url = f"https://drive.google.com/uc?export=download&id={file_id}"
          response = requests.get(url,timeout=25)
          print("HTTP", response.status_code, "content type", response.headers.get("content-type"), "bytes", len(response.content), "signature", response.content[:16])
          if not response.content.startswith(b"\\x89PNG\\r\\n\\x1a\\n"):
              raise SystemExit("Public direct original-image fetch did not yield PNG bytes.")
          open("/tmp/flic_probe.png","wb").write(response.content)
          print("SUCCESS: FLIC original public downloadable without auth")
          PY
