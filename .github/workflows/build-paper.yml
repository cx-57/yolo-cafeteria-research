name: Build research paper PDF

on:
  push:
    paths:
      - 'paper/manuscript.md'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile journal-style PDF with Pandoc and XeLaTeX
        run: |
          docker run --rm -v "$PWD:/data" -w /data pandoc/latex:3 \
            paper/manuscript.md \
            --from markdown+raw_tex+tex_math_dollars \
            --pdf-engine=xelatex \
            --number-sections \
            --standalone \
            -o paper/cafeteria-waste-sorting.pdf

      - name: Check nonempty, multipage PDF and essential research claims
        run: |
          test -s paper/cafeteria-waste-sorting.pdf
          file paper/cafeteria-waste-sorting.pdf | grep -q 'PDF document'
          pdfinfo paper/cafeteria-waste-sorting.pdf | grep -E '^Pages:'
          pdftotext paper/cafeteria-waste-sorting.pdf paper/extracted.txt
          grep -q '97.22%' paper/extracted.txt
          grep -q '87.78%' paper/extracted.txt
          grep -q 'independent' paper/extracted.txt
          rm paper/extracted.txt

      - name: Upload PDF as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeteria-waste-sorting-research-paper
          path: paper/cafeteria-waste-sorting.pdf
          retention-days: 90
          if-no-files-found: error

      - name: Commit the finished PDF to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/cafeteria-waste-sorting.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build camera-ready cafeteria waste-sorting research PDF"
            git push origin HEAD:main
          fi
