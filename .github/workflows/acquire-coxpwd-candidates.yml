name: Acquire provisional waste-image review candidates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/acquire-coxpwd-candidates.yml"
      - "scripts/stage_trashbox_candidates.py"
  push:
    paths:
      - ".github/workflows/acquire-coxpwd-candidates.yml"
      - "scripts/stage_trashbox_candidates.py"

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image review tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Stage public source images (not verified)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python scripts/stage_trashbox_candidates.py \
            --per-group 16 \
            --out "$RUNNER_TEMP/waste-source-provisional"
      - name: Upload image review artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-waste-provisional-not-independent
          path: ${{ runner.temp }}/waste-source-provisional
          if-no-files-found: error
          retention-days: 7
