name: Probe official PUST cafeteria dataset source

on:
  push:
    branches:
      - experiment/cafeteria-domain-image-intake-20261102
    paths:
      - scripts/probe_pust_source.py
      - .github/workflows/probe-pust-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe official documented public API
        run: python scripts/probe_pust_source.py
      - name: Commit tiny source-availability report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add results/pust-public-api-probe.json
          git commit -m "Record official PUST dataset access check"
          git push
