name: Pipeline tests

on:
  push:
    branches: [main, default-1x-augmentation-20261011]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install Pillow PyYAML
      - name: Run offline synthetic pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Build full default 1x corpus without training
        run: python scripts/train.py --build-only
      - name: Verify 80/20 of originals and 1x training views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("data/training/split_summary.json").read_text())
          total = s["original_images"]
          assert s["train_originals"] + s["val_originals"] == total
          assert s["val_originals"] == round(total * 0.20), s
          assert s["train_views"] == s["train_originals"]
          assert s["augment_factor"] == 1
          assert s["test_originals"] == 0
          print("Verified:", total, "originals,", s["train_originals"],
                "train,", s["val_originals"], "validation,",
                s["train_views"], "training views; test is separate")
          PY
      - name: Check every real generated image/label pair
        run: |
          python scripts/diagnose.py --dataset data/training --output /tmp/yolo-ci-diagnostics
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/yolo-ci-diagnostics/diagnosis.json").read_text())
          assert d["support_basis"] == "fresh_generated_label_scan"
          for split in ("train", "val"):
              stats = d["splits"][split]
              assert stats["images"] > 0 and stats["instances"] > 0
              assert all(row["instances"] is not None for row in stats["classes"].values())
          assert "paper_boat" in d["missing_train_classes"], "Update this guard after adding genuine paper-boat annotations"
          print("REAL DATA SCAN PASSED; unsupported validation classes:", d["missing_val_classes"])
          print("This checks file integrity and box geometry, NOT visual annotation completeness or mAP.")
          PY
      - name: Verify no audited near-duplicate pair crosses the split
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("data/training")
          summary = json.loads((root / "split_summary.json").read_text())
          assert summary["group_audit"]["matched_pairs"] > 0, "Known audit was not applied"
          train = {p.name for p in (root / "images/train").iterdir()}
          val = {p.name for p in (root / "images/val").iterdir()}
          checked = 0
          with Path("data/audits/day1/near_duplicates.csv").open(newline="") as f:
              for row in csv.DictReader(f):
                  pair = []
                  for field in ("image_a", "image_b"):
                      source, folder, filename = row[field].split("/")
                      assert folder == "images"
                      candidate = source + "__" + filename
                      pair.append(0 if candidate in train else 1 if candidate in val else None)
                  if None not in pair:
                      checked += 1
                      assert pair[0] == pair[1], f"Leaking audit pair: {row['image_a']} / {row['image_b']}"
          assert checked == summary["group_audit"]["matched_pairs"]
          print("All", checked, "matched audit pairs remain within one split.")
          print("Near-duplicate candidates are NOT proof of actual duplicates.")
          PY
      - name: Build additive LVIS food experiment without deleting occluded plates
        run: |
          python scripts/experiment.py --source data/training \
            --output data/training-ci-revised \
            --label-additions data/audits/model_revisions_2026-10-12/lvis_food_additions.json \
            --balance-classes plate wrapper bottle --max-repeat 2
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("data/training-ci-revised/experiment_summary.json").read_text())
          original = json.loads(Path("data/training/split_summary.json").read_text())
          counts = a["counts"]
          assert counts["train_originals"] == original["train_originals"]
          assert counts["val_originals"] == original["val_originals"]
          assert counts["val_views"] == original["val_originals"]
          assert counts["train_views"] >= counts["train_originals"]
          assert a["additions"]["accepted"] > 0
          assert a["corrected_support"]["train"]["plate"] == a["original_support"]["train"]["plate"]
          assert a["corrected_support"]["val"]["plate"] == a["original_support"]["val"]["plate"]
          assert a["corrected_support"]["val"]["food"]["instances"] > a["original_support"]["val"]["food"]["instances"]
          for split in ("train", "val"):
              originals = {p.name for p in Path("data/training/images", split).iterdir()}
              revised = {p.name for p in Path("data/training-ci-revised/images", split).iterdir()}
              assert originals <= revised
          print("LVIS overlay OK; original food support:", a["original_support"]["val"]["food"])
          print("LVIS overlay OK; corrected food support:", a["corrected_support"]["val"]["food"])
          print("LVIS overlay accepted boxes by split:", a["additions"]["by_split"])
          print("Plate images and every original label retained; experiment is NOT trained.")
          PY
      - name: Upload experiment integrity report
        uses: actions/upload-artifact@v4
        with:
          name: lvis-experiment-check
          path: data/training-ci-revised/experiment_summary.json
      - name: Build full V2 dataset using Codex-reviewed annotations
        run: |
          python scripts/v2.py build \
            --source data/training \
            --output data/training-ci-v2-reviewed \
            --provisional --use-codex-review
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/training-ci-v2-reviewed/v2_build.json").read_text())
          summary = json.loads(Path("data/training-ci-v2-reviewed/experiment_summary.json").read_text())
          assert report["reviewed_audit_applied"] is True
          expected = json.loads(Path(
              "data/audits/v2_review_2026-10-12/reviewed_overrides.json").read_text())
          assert len(report["reviewed_overrides"]) == len(expected)
          assert len(expected) >= 51
          assert summary["additions"]["accepted"] >= 500
          assert report["final_audit"]["image_counts"]["train"] > 2400
          assert report["final_audit"]["image_counts"]["val"] > 0
          assert report["dataset_sha256"]
          # Full-resolution manually reviewed V2 label replacements: check
          # both food-retention and previously omitted visible classes.
          labels = Path("data/training-ci-v2-reviewed/labels")
          for stem, classes in {
              "plate__train__lvis_000000354530": {0},
              "plate__train__lvis_000000125242": {0,1},
              "plate__train__lvis_000000323499": {0,1,3},
              "school_lunch__010862000_jpg.rf.7f9d54edb0d5f9ab5ccc40ed2211894e": {0,1,6,10},
              "school_lunch__020309000_jpg.rf.5212d4f01a873ff9cae7db730ac70037": {0,1,3,6,10},
              "school_lunch__010017001_jpg.rf.ac34e128d803349b8217d73abfb771eb": {0,1,6,10},
              "school_lunch__010136001_jpg.rf.8a9132053805dd903b77f69216f27b0a": {0,1,6,10},
              "food_american__train__download_jpg.rf.96e3fa67b86bee33aa431fa38d52ad7f": {0,10},
              "food_american__train__images_jpg.rf.0653523d0d9581b6ddde2a3d58f72373": {0,10},
              "food_american__test__download_jpg.rf.5c6383bb584eb0d354c44cf2ba48a6db": {0,10},
              "food_american__test__download_jpg.rf.efc6e770783c171650906f9ca480f946": {0,1},
              "food_american__train__66917eb04126ff19e85ed243-korean-samyang-hot-spicy-noodle-fire_jpg.rf.51e9633f36454dd5e292a6af13c82c95": {0,1},
              "food_american__train__download_jpg.rf.338119416af2ab7f5a4777f3aa6fcd3e": {0,10},
              "food_american__train__download_jpg.rf.f6973be9c209ba7a2d7446775795e4ec": {0,1},
              "food_american__train__images_jpg.rf.0fd69d3922f8cdaa5407c3d0b508d39c": {0,1},
              "food_american__train__images_jpg.rf.138836a52138e46a6afff40a31fadac3": {0,10},
              "food_american__train__images_jpg.rf.4339270eba128c4719f0e51a1f21b002": {0,10},
              "food_american__train__images_jpg.rf.464f72a9d4e66d46a5d3dd58b0b40a3a": {0,1},
              "school_lunch__010037000_jpg.rf.df39e985a18dc633b7b3f30202d416f3": {0,1,6,10},
              "school_lunch__010069000_jpg.rf.89148db6509d73cda216904a95a6786b": {0,1,6,10},
              "school_lunch__010083000_jpg.rf.df3aa96738dc40f516c3df9dd18042eb": {0,1,6,10},
              "school_lunch__010083001_jpg.rf.acafab3469d573c7a54683d8cc2f6848": {0,1,6,10},
              "school_lunch_asian__010020000_jpg.rf.d779bcde36c5c67ac8a11f7790548b76": {0,1,6,10},
              "school_lunch_asian__010050001_jpg.rf.87a8a83af8d38fb9d23b92a6b6470c1f": {0,1,6,10},
              "school_lunch_asian__010082001_jpg.rf.86dde1bfd428f1231c7bad0689598b0d": {0,1,6,10},
              "school_lunch_asian__010087001_jpg.rf.d37e466442f63cca5745f167150b9fc2": {0,1,6,10},
              "school_lunch_asian__010102001_jpg.rf.3cef8fa8ac291fce7b172ee08eff0ded": {0,1,6,10},
              "school_lunch_asian__010108001_jpg.rf.2d4e28798ee61c47313e994bdd53bcf0": {0,1,6,10}
          }.items():
              candidates = list(labels.glob("*/"+stem+".txt"))
              assert len(candidates) == 1, (stem,candidates)
              actual = {int(row.split()[0]) for row in candidates[0].read_text().splitlines()}
              assert actual == classes, (stem,actual,classes)
          print("PASS direct visual correction class coverage: plate, food, soup bowls and utensils")
          # For every newly reviewed Asian-lunch image, verify original food
          # targets are unchanged and exactly three missing container boxes
          # were appended: one plate and two independently visible bowls.
          import collections
          fixes = [r for r in expected if r["source"] == "school_lunch_asian"]
          assert len(fixes) >= 14, len(fixes)
          for item in fixes:
              stem = "school_lunch_asian__" + Path(item["image"]).stem
              produced = list(labels.glob("*/" + stem + ".txt"))
              original = list(Path("data/training/labels").glob("*/" + stem + ".txt"))
              assert len(produced) == len(original) == 1, (stem, produced, original)
              source_lines = original[0].read_text().strip().splitlines()
              actual_lines = produced[0].read_text().strip().splitlines()
              assert actual_lines[:len(source_lines)] == source_lines, stem
              appended = actual_lines[len(source_lines):]
              assert len(appended) == 3, (stem, appended)
              assert collections.Counter(int(line.split()[0]) for line in appended) == {1:1,10:2}, stem
          print("PASS 14+ actual Asian cafeteria images with 1 plate + 2 bowls each, source food targets preserved")
          # Genuine full-resolution bottle/wrapper omissions: append one
          # target class box without disturbing the original V1 label.
          for stem, added_class in {
              "trash_detection__train__000003_jpg.rf.a09e1be0feb717e4ba4a41113f9b0a4d": 9,
              "trash_detection__train__000005_JPG.rf.457af049215a7141728329200f838bd8": 8
          }.items():
              original = list(Path("data/training/labels").glob("*/" + stem + ".txt"))
              corrected = list(labels.glob("*/" + stem + ".txt"))
              assert len(original) == len(corrected) == 1
              before = original[0].read_text().strip().splitlines()
              after = corrected[0].read_text().strip().splitlines()
              assert after[:len(before)] == before
              assert len(after) == len(before) + 1
              assert int(after[-1].split()[0]) == added_class
          print("PASS added green bottle and separate cookie wrapper; original boxes intact")
          # These five photos are visually verified torn sheets of paper,
          # not cafeteria napkins. V2 keeps the photos as negative examples;
          # original V1 class-5 labels remain unchanged.
          negatives = (
              "test__paper60_jpg.rf.73d291a8166688bf2c5608b92092418f",
              "train__paper191_jpg.rf.a2f073f30f0e628c0f1cb3405c90077f",
              "train__paper528_jpg.rf.671a8f48554d5bdc824dfb5e9a7562e5",
              "train__paper538_jpg.rf.c3d5b8043687ba0f72e92a82e44b39aa",
              "train__paper63_jpg.rf.d5f2acae59c3188321f106cb261a9d53",
          )
          for name in negatives:
              output = Path("data/training-ci-v2-reviewed/labels/train") / ("dry_wet_waste__" + name + ".txt")
              original = Path("data/training/labels/train") / ("dry_wet_waste__" + name + ".txt")
              assert output.is_file() and not output.read_text().strip(), output
              assert original.is_file() and original.read_text().startswith("5 "), original
          print("Five corrected false-napkin negatives in V2 only; V1 labels unchanged")
          print("FULL V2 REVIEWED DATASET SMOKE PASS")
          print("Image counts:", report["final_audit"]["image_counts"])
          print("Approved food boxes accepted:", summary["additions"]["accepted"])
          print("Split repairs:", len(report["legacy_split_repairs"]))
          print("Still missing:", report["final_audit"]["missing_classes"])
          PY
      - name: Verify train-only small-object crop experiment on full reviewed corpus
        run: |
          python scripts/experiment.py \
            --source data/training-ci-v2-reviewed \
            --output data/training-ci-v2-focus \
            --balance-classes wrapper bottle plate --max-repeat 2 --crop-repeats
          python - <<'PY'
          from pathlib import Path
          import json
          import hashlib
          from scripts.experiment import validate_rows
          from scripts.train import class_names
          before = Path("data/training-ci-v2-reviewed")
          after = Path("data/training-ci-v2-focus")
          report = json.loads((after / "experiment_summary.json").read_text())
          assert report["focus_crops"]["cropped_train_views"] > 0, report["focus_crops"]
          assert report["counts"]["train_views"] > report["counts"]["train_originals"]
          assert report["counts"]["val_originals"] == report["counts"]["val_views"] == 591
          for category in ("images", "labels"):
              a = before / category / "val"
              b = after / category / "val"
              assert {p.name for p in a.iterdir()} == {p.name for p in b.iterdir()}
              for file in a.iterdir():
                  assert hashlib.sha256(file.read_bytes()).digest() == hashlib.sha256(
                      (b/file.name).read_bytes()).digest(), file
          verified = 0
          for path in (after/"images/train").iterdir():
              rows = (after/"labels/train"/(path.stem+".txt")).read_text().splitlines()
              validate_rows(rows, path, class_names())
              verified += 1
          assert verified == report["counts"]["train_views"]
          assert report["focus_crops"]["validation_unchanged"]
          print("FOCUS CROP INTEGRITY PASS: ", report["focus_crops"],
                "train views:", verified, "untouched validation:", 591)
          PY
      - name: Generate complete 3096-image visual review register
        run: |
          python scripts/v2.py review-queue \
            --data data/training-ci-v2-reviewed/data.yaml \
            --output /tmp/v2_review_queue.csv
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          with Path("/tmp/v2_review_queue.csv").open(newline="") as stream:
              rows = list(csv.DictReader(stream))
          counts = Counter(row["review_status"] for row in rows)
          assert len(rows) == 3096
          assert counts["full_image_verified"] >= 69
          assert sum(counts.values()) == 3096
          assert counts["not_verified"] > 0  # no claim of complete audit
          assert all(row["requires_all_11_class_review"] == "yes"
                     for row in rows if row["review_status"] != "full_image_verified")
          print("V2 PHOTO REVIEW REGISTER PASS:", counts)
          PY
      - name: Upload full per-image V2 review queue
        uses: actions/upload-artifact@v4
        with:
          name: v2-per-image-review-queue
          path: /tmp/v2_review_queue.csv
      - name: Build paper-boat draft V2 with new provisional training images
        run: |
          python scripts/v2.py build \
            --source data/training \
            --output data/training-ci-v2-paperboat-drafts \
            --provisional --use-codex-review \
            --candidate-manifest data/v2_candidates/lvis_trays/provisional_manifest.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/training-ci-v2-paperboat-drafts")
          r = json.loads((p/"v2_build.json").read_text())
          assert r["provisional"] and r["unverified_candidate_images"] == 5
          assert r["final_audit"]["instances"]["train"]["paper_boat"] == 7
          assert "paper_boat" in r["final_audit"]["missing_classes"]["val"]
          assert r["final_audit"]["image_counts"]["train"] == 2510
          assert r["final_audit"]["image_counts"]["val"] == 591
          print("PASS 5 provisional paper-boat photos / 7 boat boxes, TRAIN ONLY")
          PY
      - name: Preserve Codex-reviewed V2 build report
        uses: actions/upload-artifact@v4
        with:
          name: codex-reviewed-v2-integrity
          path: |
            data/training-ci-v2-reviewed/v2_build.json
            data/training-ci-v2-reviewed/experiment_summary.json
      - name: Preserve real label scan report
        uses: actions/upload-artifact@v4
        with:
          name: real-label-diagnostics
          path: /tmp/yolo-ci-diagnostics/
      - name: Preserve split and class counts
        uses: actions/upload-artifact@v4
        with:
          name: split-summary
          path: data/training/split_summary.json

  ml-integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch and pinned Ultralytics
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ultralytics==8.4.175 PyYAML Pillow
      - name: Run real upstream partial-label loss and gradient tests
        run: python -m unittest discover -s tests -p "test_partial_labels.py" -v
      - name: One-epoch real-image training-loop smoke (untrained model)
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import tempfile
          import yaml
          from ultralytics import YOLO
          sys.path.insert(0, str(Path("scripts").resolve()))
          from partial_labels import make_trainer
          from train import class_names
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              ids = ["train__lvis_000000225490", "train__lvis_000000478368"]
              for split in ("train", "val"):
                  images, labels = root/"images"/split, root/"labels"/split
                  images.mkdir(parents=True)
                  labels.mkdir(parents=True)
                  for name in (ids if split=="train" else ids[:1]):
                      source = Path("data/processed/plate")
                      shutil.copy2(source/"images"/(name+".jpg"),
                                   images/("plate__"+name+".jpg"))
                      shutil.copy2(source/"labels"/(name+".txt"),
                                   labels/("plate__"+name+".txt"))
              config = root/"data.yaml"
              config.write_text(yaml.safe_dump({
                  "path":str(root), "train":"images/train", "val":"images/val",
                  "names":class_names()}, sort_keys=False))
              model = YOLO("yolo11n.yaml")
              model.train(trainer=make_trainer(
                  "data/audits/model_revisions_2026-10-12/source_coverage.json"),
                  data=str(config), epochs=1, imgsz=128, batch=2,
                  device="cpu", workers=0, amp=False, val=False,
                  optimizer="SGD", plots=False, save=False, project=str(root),
                  name="loss-smoke", mosaic=0, close_mosaic=0, mixup=0,
                  cutmix=0, copy_paste=0, cache=False)
              print("Real photo + masked criterion training loop completed.")
              print("No trained-checkpoint accuracy or mAP is claimed.")
          PY
      - name: Build Codex-reviewed dataset for full train-evaluate-predict smoke
        run: |
          python scripts/train.py --build-only
          python scripts/v2.py build \
            --source data/training --output data/training-ci-v2-reviewed \
            --provisional --use-codex-review
      - name: Train and validate normal and class-weighted pretrained YOLO11n
        env:
          YOLO_CONFIG_DIR: /tmp/yolo-v2-real-smoke-config
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python tests/v2_real_smoke.py
      - name: Save V2 reviewed training smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-reviewed-real-training-smoke
          path: |
            model/runs/ci-v2-*/results.csv
            model/runs/ci-v2-*-evaluation/metrics.json
          if-no-files-found: ignore
