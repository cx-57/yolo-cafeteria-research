name: Build research paper PDF

on:
  push:
    paths:
      - 'paper/manuscript.md'
      - 'paper/figures.py'
      - 'paper/twocolumn.lua'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create publication figures
        run: |
          python -m pip install --disable-pip-version-check matplotlib==3.10.1
          python paper/figures.py

      - name: Compile two-column PDF styled after the live tennis paper
        run: |
          docker run --rm -v "$PWD:/data" -w /data pandoc/latex:3 \
            paper/manuscript.md \
            --from markdown+raw_tex+tex_math_dollars \
            --lua-filter=paper/twocolumn.lua \
            --pdf-engine=xelatex \
            --number-sections \
            --standalone \
            -o paper/cafeteria-waste-sorting.pdf

      - name: Validate PDF structure, page count, and claims
        run: |
          python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p = Path('paper/cafeteria-waste-sorting.pdf')
          assert p.exists() and p.stat().st_size > 30_000
          reader = PdfReader(str(p))
          print('Rendered PDF pages:',len(reader.pages))
          assert 5 <= len(reader.pages) <= 18
          full = ' '.join((pg.extract_text() or '') for pg in reader.pages)
          for token in ('87.78', '97.22', 'independent', 'SelectiveNet'):
              assert token in full, f'Missing manuscript token {token}'
          print('PDF preflight passed:',p.stat().st_size,'bytes')
          PY

      - name: Render pages for two-column typography inspection
        if: github.ref == 'refs/heads/paper/editorial-review-20261101'
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.29'
          python - <<'PY'
          from pathlib import Path
          import fitz
          doc = fitz.open('paper/cafeteria-waste-sorting.pdf')
          for page_index, label in [(0, 'first'), (min(2, len(doc)-1), 'tables'), (min(3, len(doc)-1), 'results'), (len(doc)-1, 'last')]:
              pix = doc[page_index].get_pixmap(matrix=fitz.Matrix(1.45, 1.45), alpha=False)
              pix.save(f'paper/preview-{label}.png')
          first_page = doc[0].get_text()
          for token in ('87.78', '97.22', '68.18'):
              if token not in first_page:
                  print('FIRST-PAGE ABSTRACT CHECK:', token, 'not present')
          clipped = []
          for page_index, page in enumerate(doc):
              for block in page.get_text('dict')['blocks']:
                  for line in block.get('lines', []):
                      for span in line['spans']:
                          x0, y0, x1, y1 = span['bbox']
                          if x0 < -1 or x1 > page.rect.width + 1:
                              clipped.append((page_index + 1, span['text'][:40], x0, x1))
          if clipped:
              print('LAYOUT REVIEW FLAG:', clipped[:12])
          print('Page previews and text bounds verified:', len(doc), 'pages')
          PY

      - name: Upload PDF as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeteria-waste-sorting-research-paper
          path: paper/cafeteria-waste-sorting.pdf
          retention-days: 90
          if-no-files-found: error

      - name: Commit finished PDF to the manuscript branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/paper/editorial-review-20261101'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/cafeteria-waste-sorting.pdf
          if [ "${GITHUB_REF_NAME}" = 'paper/editorial-review-20261101' ]; then
            git add paper/preview-first.png paper/preview-tables.png paper/preview-results.png paper/preview-last.png
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Build updated cafeteria waste-sorting research PDF"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
