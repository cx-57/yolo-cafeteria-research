name: One-time branch archive and cleanup

on:
  push:
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'cx-57/yolo-cafeteria-research' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Backup, verify, then prune non-main branches
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          grep -Fxq main branches.txt || { echo "main not present; abort" >&2; exit 1; }
          grep -Fxv main branches.txt > prune.txt || true
          echo "Non-main branches: $(wc -l < prune.txt)"
          : > planned.txt
          while IFS= read -r branch; do
            [[ -n "$branch" ]] || continue
            sha="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha')"
            [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo "Cannot read $branch" >&2; exit 1; }
            printf '%s %s\n' "$sha" "$branch" >> planned.txt
          done < prune.txt

          # Back up EVERY commit before deleting ANY branch.
          while read -r sha branch; do
            [[ -n "$branch" ]] || continue
            echo "Backing up: $branch"
            tag="pre-branch-prune-20261119/$branch"
            url="repos/$GH_REPO/git/ref/tags/$tag"
            if gh api "$url" >/dev/null 2>&1; then
              existing="$(gh api "$url" --jq '.object.sha')"
              [[ "$existing" == "$sha" ]] || { echo "Tag conflict: $branch" >&2; exit 1; }
            else
              if ! gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null; then
                echo "Failed to create backup for $branch" >&2
                exit 1
              fi
            fi
            ok=false
            for attempt in 1 2 3 4 5; do
              actual="$(gh api "$url" --jq '.object.sha' 2>/dev/null || true)"
              if [[ "$actual" == "$sha" ]]; then ok=true; break; fi
              sleep 2
            done
            [[ "$ok" == true ]] || { echo "Failed to verify backup: $branch" >&2; exit 1; }
          done < planned.txt
          echo "All backups verified."

          # Lease-check the current branch head immediately before each deletion.
          while read -r sha branch; do
            [[ -n "$branch" ]] || continue
            current="$(gh api "repos/$GH_REPO/branches/$branch" --jq '.commit.sha')"
            [[ "$current" == "$sha" ]] || { echo "Changed branch; abort: $branch" >&2; exit 1; }
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null
            echo "Deleted: $branch"
          done < planned.txt

          gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' > after.txt
          [[ "$(cat after.txt)" == "main" ]] || { echo "Unexpected remaining branches" >&2; cat after.txt; exit 1; }
          echo "Success: only main remains; 35 histories are preserved under backup tags."
