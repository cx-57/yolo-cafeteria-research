name: Diverse new hinged-container source photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stage-new-hinged-photos.yml"
      - "scripts/stage_new_hinged_photos.py"

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch older Commons screening metadata to prevent reused images
        uses: actions/download-artifact@v4
        with:
          name: commons-licensed-photo-candidates-not-independent
          run-id: 41317184879
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-commons
      - name: Stage distinct, license-screened container and negative photos
        run: |
          python scripts/stage_new_hinged_photos.py \
            --exclude-previous-review "$RUNNER_TEMP/prior-commons/review.csv" \
            --out "$RUNNER_TEMP/hinged-new-candidates"
      - name: Verify staging manifest and source exclusions
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          folder=root/'hinged-new-candidates'
          current=json.loads((folder/'manifest.json').read_text())
          previous=list(csv.DictReader((root/'prior-commons/review.csv').open()))
          excluded={r['commons_title'] for r in previous}
          rows=current['images']
          assert len(rows)>=15 and len({r['commons_title'] for r in rows})==len(rows)
          assert all(r['commons_title'] not in excluded for r in rows)
          assert all(hashlib.sha256((folder/'images'/r['filename']).read_bytes()).hexdigest()==r['packaged_sha256'] for r in rows)
          assert current['train_approved']==current['boxes_annotated']==0
          assert (folder/'index.html').is_file() and (folder/'contact-sheet.jpg').is_file()
          print('Verified:',len(rows),'new distinct Commons file titles; no prior source title overlap; hashes match')
          PY
      - name: Publish new downloadable image contact sheet and photo batch
        uses: actions/upload-artifact@v4
        with:
          name: new-hinged-container-photo-candidates-UNLABELED
          path: ${{ runner.temp }}/hinged-new-candidates/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
