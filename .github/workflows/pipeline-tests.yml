name: Pipeline tests

on:
  push:
    branches: [main, default-1x-augmentation-20261011]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install Pillow PyYAML
      - name: Run offline synthetic pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Build full default 1x corpus without training
        run: python scripts/train.py --build-only
      - name: Verify 80/20 of originals and 1x training views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("data/training/split_summary.json").read_text())
          total = s["original_images"]
          assert s["train_originals"] + s["val_originals"] == total
          assert s["val_originals"] == round(total * 0.20), s
          assert s["train_views"] == s["train_originals"]
          assert s["augment_factor"] == 1
          assert s["test_originals"] == 0
          print("Verified:", total, "originals,", s["train_originals"],
                "train,", s["val_originals"], "validation,",
                s["train_views"], "training views; test is separate")
          PY
      - name: Inspect every generated label and count small boxes at 640px
        run: |
          python scripts/diagnose.py --dataset data/training --imgsz 640 --output data/audits/ci-full-diagnosis
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/audits/ci-full-diagnosis/diagnosis.json").read_text())
          for split in ("train", "val"):
              x = d["splits"][split]
              print(f"{split}: {x['images']} images, {x['instances']} labeled objects")
              for name, counts in x["classes"].items():
                  print(f"  {name}: {counts['images']} images, {counts['instances']} objects, "
                        f"{counts['short_side_under_32px']} short-side-under-32px")
          assert d["splits"]["train"]["images"] == 2477
          assert d["splits"]["val"]["images"] == 619
          assert d["splits"]["train"]["instances"] > 0
          assert d["splits"]["val"]["instances"] > 0
          assert d["support_basis"] == "fresh_generated_label_scan"
          PY
      - name: Preserve comprehensive label audit
        uses: actions/upload-artifact@v4
        with:
          name: full-label-diagnosis
          path: |
            data/audits/ci-full-diagnosis/diagnosis.json
            data/audits/ci-full-diagnosis/class_support.csv
      - name: Preserve split and class counts
        uses: actions/upload-artifact@v4
        with:
          name: split-summary
          path: data/training/split_summary.json
