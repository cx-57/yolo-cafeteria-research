name: V2 data safety tests

on:
  push:
    paths:
      - 'scripts/v2.py'
      - 'scripts/experiment.py'
      - 'scripts/train.py'
      - 'scripts/prepare.py'
      - 'tests/test_v2.py'
      - 'tests/test_experiment.py'
      - '.github/workflows/v2-tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  v2-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast-test requirements
        run: python -m pip install Pillow PyYAML
      - name: Run V2 integration tests
        run: python -m unittest discover -s tests -p 'test_v2.py' -v
      - name: Run dataset experiment tests
        run: python -m unittest discover -s tests -p 'test_experiment.py' -v
