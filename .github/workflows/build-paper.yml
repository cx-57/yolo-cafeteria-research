name: Build research paper PDF

on:
  push:
    paths:
      - 'paper/manuscript.md'
      - 'paper/figures.py'
      - 'paper/twocolumn.lua'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create publication figures
        run: |
          python -m pip install --disable-pip-version-check matplotlib==3.10.1
          python paper/figures.py

      - name: Compile two-column PDF styled after the live tennis paper
        run: |
          docker run --rm -v "$PWD:/data" -w /data pandoc/latex:3 \
            paper/manuscript.md \
            --from markdown+raw_tex+tex_math_dollars \
            --lua-filter=paper/twocolumn.lua \
            --pdf-engine=xelatex \
            --number-sections \
            --standalone \
            -o paper/cafeteria-waste-sorting.pdf

      - name: Validate PDF structure, page count, and claims
        run: |
          python -m pip install --disable-pip-version-check 'pypdf>=5,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p = Path('paper/cafeteria-waste-sorting.pdf')
          assert p.exists() and p.stat().st_size > 30_000
          reader = PdfReader(str(p))
          print('Rendered PDF pages:',len(reader.pages))
          assert 5 <= len(reader.pages) <= 18
          full = ' '.join((pg.extract_text() or '') for pg in reader.pages)
          for token in ('87.78', '97.22', 'independent', 'SelectiveNet'):
              assert token in full, f'Missing manuscript token {token}'
          print('PDF preflight passed:',p.stat().st_size,'bytes')
          PY

      - name: Render editorial page previews
        if: github.ref == 'refs/heads/paper/editorial-review-20261101'
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.29'
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf=fitz.open('paper/cafeteria-waste-sorting.pdf')
          out=Path('paper/layout-review')
          out.mkdir(exist_ok=True)
          for i,p in enumerate(pdf):
              p.get_pixmap(matrix=fitz.Matrix(1.12,1.12),alpha=False).save(out/f'page-{i+1:02d}.png')
          print('Editorial review pages:',len(pdf))
          PY

      - name: Upload PDF as downloadable GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeteria-waste-sorting-research-paper
          path: paper/cafeteria-waste-sorting.pdf
          retention-days: 90
          if-no-files-found: error

      - name: Commit finished PDF to the manuscript branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/paper/editorial-review-20261101'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/cafeteria-waste-sorting.pdf
          if [ "${GITHUB_REF_NAME}" = 'paper/editorial-review-20261101' ]; then git add paper/layout-review/page-*.png; fi
          if ! git diff --cached --quiet; then
            git commit -m "Build updated cafeteria waste-sorting research PDF"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
